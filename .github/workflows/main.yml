name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [1.99.1, stable]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install compiler and tools
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Formatting
        if: matrix.toolchain == '1.99.1'
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Tests (no Java or network access required by tests)
        run: cargo +${{ matrix.toolchain }} test --workspace --all-targets --all-features --locked
      - name: Documentation tests
        run: cargo +${{ matrix.toolchain }} test --workspace --doc --locked
      - name: Clippy
        run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: API documentation
        run: cargo +${{ matrix.toolchain }} doc --workspace --no-deps --locked
